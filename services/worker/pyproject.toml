[project]
name = "rl-worker"
version = "0.1.0"
description = "ReleaseLens background worker: Kafka consumers, Postgres job runner, outbox relay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rl-core",
    "rl-db",
    "pydantic-settings>=2.6",
    "confluent-kafka>=2.6",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[project.scripts]
rl-worker = "rl_worker.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
