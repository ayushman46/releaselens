[project]
name = "releaselens-workspace"
version = "0.1.0"
description = "ReleaseLens monorepo workspace root (not a distributable package)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/rl_core",
    "packages/rl_db",
    "services/api",
    "services/worker",
    "data/pipeline",
    "demo/services",
    "ml",
]

[tool.uv.sources]
rl-core = { workspace = true }
rl-db = { workspace = true }
rl-api = { workspace = true }
rl-worker = { workspace = true }
rl-pipeline = { workspace = true }
rl-demo = { workspace = true }
rl-ml = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres,kafka]>=4.8",
    "opentelemetry-sdk>=1.28",
    "rl-core",
    "rl-db",
    "rl-api",
    "rl-worker",
    "rl-pipeline",
    "rl-demo",
    "rl-ml",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/alembic/versions/*.py.tmpl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N", "C4", "PIE", "RET", "PTH"]
ignore = [
    "S101",   # assert is fine in tests and for invariants
    "RET504", # unnecessary assignment before return hurts readability rarely
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PT011", "N802"]
# scikit-learn convention: feature matrices are `X`, `Xtr`, `Xva`
"ml/**" = ["N803", "N806"]
# Markdown generator: typographic characters (×, –, ≥) and long template lines
"ml/src/rl_ml/card.py" = ["RUF001", "E501"]
"**/alembic/versions/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["rl_core", "rl_db", "rl_api", "rl_worker", "rl_ml", "rl_pipeline", "rl_analysis", "rl_demo"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = [
    "packages/rl_core/src",
    "packages/rl_db/src",
    "services/api/src",
    "services/worker/src",
    "data/pipeline/src",
    "demo/services/src",
    "ml/src",
]

[[tool.mypy.overrides]]
module = ["rl_core.*", "rl_db.*"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs Docker (testcontainers) or running services",
    "slow: long-running test",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["rl_core", "rl_db", "rl_api", "rl_worker", "rl_pipeline", "rl_demo", "rl_ml"]

[[tool.mypy.overrides]]
# confluent-kafka ships py.typed but re-exports admin classes without __all__.
module = ["confluent_kafka.*"]
implicit_reexport = true
