name: data

# Data-quality gates on the small, clearly-labelled SYNTHETIC fixtures checked into the repo.
# The real TravisTorrent file is never downloaded in CI.
on:
  push:
    branches: [main]
    paths: ["data/**", "packages/rl_core/**", "ml/**", ".github/workflows/data.yml"]
  pull_request:
    paths: ["data/**", "packages/rl_core/**", "ml/**", ".github/workflows/data.yml"]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
          enable-cache: true
      - run: uv sync --all-packages --frozen --python 3.12
      - name: Pipeline tests on the synthetic fixture
        run: uv run pytest -m "not integration" data
