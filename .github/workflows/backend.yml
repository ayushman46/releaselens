name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by full commit SHA (ADR-0014). Tag in the trailing comment.
jobs:
  lint-type-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen --python 3.12
      - name: Ruff (lint + format)
        run: make lint
      - name: mypy
        run: make typecheck
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing:skip-covered

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-type-unit
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.12"
          enable-cache: true
      - name: Install workspace
        run: uv sync --all-packages --frozen --python 3.12
      - name: Integration tests (testcontainers — Postgres 16, Kafka 4.3 native, S3)
        run: uv run pytest -m integration

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint-type-unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build shared Python image
        run: docker build -f infra/docker/python.Dockerfile -t rlens/python:ci .
      - name: Smoke-test image entrypoints
        run: |
          docker run --rm rlens/python:ci python -c "import rl_api, rl_worker, rl_db, rl_core; print('ok')"
          docker run --rm rlens/python:ci python -m rl_db.migrate --help
